
name: Docker Build and Health Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-flask-app ./devops-assigment-2

      - name: Run container
        run: docker run -d --name devops-flask-container -p 5000:5000 devops-flask-app

      - name: Test health endpoint
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          docker logs devops-flask-container
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker stop devops-flask-container || true
          docker rm devops-flask-container || true
